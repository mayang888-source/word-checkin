<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>英语高频词 · 每日打卡</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#EEF0F3;color:#1F2430;min-height:100vh;display:flex;justify-content:center}
  #app{width:100%;max-width:480px;min-height:100vh;background:#F3F4F6;padding-bottom:70px;position:relative}
  .hd{height:50px;background:#fff;display:flex;align-items:center;justify-content:center;position:relative;font-size:17px;font-weight:600;border-bottom:1px solid #EDEFF2}
  .hd .back{position:absolute;left:10px;font-size:22px;color:#333;padding:4px 10px;cursor:pointer}
  .wrap{padding:12px}
  .card{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 1px 4px rgba(20,30,50,.04)}
  .btn{display:block;width:100%;border:none;border-radius:12px;padding:15px;font-size:16px;font-weight:700;cursor:pointer}
  .btn:active{opacity:.8}
  .btn-green{background:#1BA35C;color:#fff}
  .btn-orange{background:#F5A22B;color:#fff}
  .btn-white{background:#fff;color:#333;border:1px solid #E3E6EA}
  .muted{color:#8A8F99;font-size:12px;line-height:1.6}
  .hidden{display:none!important}
  /* setup */
  .logo{width:64px;height:64px;border-radius:16px;background:#2F6BF6;color:#fff;font-size:28px;font-weight:800;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;letter-spacing:1px}
  .big-title{text-align:center;font-size:22px;font-weight:800;letter-spacing:.5px}
  .sub{text-align:center;color:#8A8F99;font-size:13px;margin-top:6px}
  input[type=text]{width:100%;border:1px solid #E3E6EA;border-radius:12px;padding:14px;font-size:15px;background:#fff;outline:none}
  input[type=text]:focus{border-color:#1BA35C}
  .chips{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
  .chip{border:1px solid #E3E6EA;border-radius:12px;padding:12px 4px;text-align:center;font-size:14px;color:#4A4F59;background:#fff;cursor:pointer}
  .chip.on{border-color:#1BA35C;color:#1BA35C;background:#E8F7EE;font-weight:700}
  /* home */
  .urow{display:flex;align-items:center;gap:10px}
  .avatar{width:44px;height:44px;border-radius:50%;background:#F0F2F5;display:flex;align-items:center;justify-content:center;font-size:22px}
  .uname{font-size:17px;font-weight:700}
  .usub{font-size:12px;color:#8A8F99;margin-top:2px}
  .pill{margin-left:auto;background:#E8F7EE;color:#1BA35C;font-size:12px;font-weight:600;border-radius:20px;padding:6px 12px}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
  .stat{background:#F5F7F8;border-radius:12px;padding:10px 4px;text-align:center}
  .stat b{display:block;font-size:20px;color:#1BA35C}
  .stat i{font-style:normal;font-size:11px;color:#8A8F99}
  .task{text-align:center}
  .task .ic{font-size:34px}
  .task h3{font-size:18px;margin-top:8px;font-weight:800}
  .task p{color:#8A8F99;font-size:13px;margin:6px 0 14px}
  .grid15{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}
  .cell{height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:14px;background:#F1F2F4;color:#B9BDC4;font-weight:600}
  .cell.done{background:#E8F7EE;color:#1BA35C}
  .cell.cur{background:#1BA35C;color:#fff}
  .tabs{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;background:#fff;display:flex;border-top:1px solid #EDEFF2;z-index:9}
  .tab{flex:1;padding:8px 0 10px;text-align:center;font-size:11px;color:#9AA0A9;cursor:pointer}
  .tab.on{color:#1BA35C;font-weight:700}
  .tab svg{display:block;margin:0 auto 3px}
  /* learn */
  .tagline{display:flex;justify-content:space-between;align-items:center}
  .tag{background:#E8F7EE;color:#1BA35C;font-size:12px;font-weight:700;border-radius:8px;padding:5px 10px}
  .word{text-align:center;font-size:44px;font-weight:800;color:#1BA35C;margin-top:22px;letter-spacing:1px}
  .cmean{text-align:center;font-size:18px;color:#6B7280;margin-top:6px}
  .pills{display:flex;gap:10px;justify-content:center;margin:18px 0}
  .pillbtn{border:none;border-radius:22px;padding:10px 18px;font-size:14px;font-weight:600;cursor:pointer}
  .pb-green{background:#E8F7EE;color:#1BA35C}
  .pb-orange{background:#FDF1E0;color:#E98A1B}
  .exbox{background:#F5F6F8;border-radius:12px;padding:12px}
  .exbox .en{font-size:15px;color:#1F2430}
  .exbox .say{color:#E98A1B;font-size:13px;font-weight:600;cursor:pointer;margin-left:6px}
  .exbox .cn{font-size:12px;color:#8A8F99;margin-top:4px}
  /* quiz */
  .q{font-size:19px;font-weight:800;line-height:1.5;margin:10px 0 16px}
  .opt{border:1px solid #E3E6EA;border-radius:12px;padding:14px;font-size:16px;margin-bottom:10px;background:#fff;cursor:pointer}
  .opt.right{border-color:#1BA35C;background:#E8F7EE;color:#128a4c;font-weight:700}
  .opt.wrong{border-color:#E05252;background:#FDECEC;color:#C03636}
  .tip{background:#FFF8E8;color:#B4761A;font-size:13px;border-radius:10px;padding:10px 12px;margin-top:12px;line-height:1.6}
  .fb{margin-top:12px;font-size:14px;font-weight:700}
  .fb.ok{color:#128a4c}.fb.no{color:#C03636}
  /* result */
  .res{text-align:center;padding:24px 8px}
  .res .emo{font-size:56px}
  .res h2{font-size:20px;margin-top:8px}
  .res .score{font-size:44px;font-weight:800;color:#1BA35C;margin:8px 0}
  .badge{font-size:13px;color:#6B7280;margin-top:6px}
  /* report */
  .rcard{background:#1BA35C;border-radius:16px;padding:16px;color:#fff}
  .rcard h3{font-size:17px}
  .rcard p{font-size:12px;opacity:.92;margin-top:6px}
  .rrow{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed #EDEFF2;font-size:15px}
  .rrow:last-child{border-bottom:none}
  .rrow .ok{color:#1BA35C}
  .rrow .no{color:#E05252}
  .rstats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
  .rstat{background:#E8F7EE;border-radius:12px;padding:10px 2px;text-align:center}
  .rstat b{display:block;color:#1BA35C;font-size:16px}
  .rstat i{font-style:normal;font-size:10px;color:#5FA57F}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .rowline{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #F0F2F5;font-size:15px}
  .rowline:last-child{border-bottom:none}
  .rowline small{color:#8A8F99;font-size:12px}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;font-size:12px}
  .cal .d{height:34px;line-height:34px;border-radius:8px;color:#4A4F59}
  .cal .d.has{background:#E8F7EE;color:#1BA35C;font-weight:700}
  .cal .d.today{outline:2px solid #1BA35C}
  .cal .hd7{color:#B9BDC4;font-weight:600}
  .center{text-align:center}
</style>
</head>
<body>
<div id="app"></div>
<script src="words.js"></script>
<script>
(function(){
"use strict";
var KEY="yqgd_v1";
var S=null;
try{S=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){S=null}
if(!S||typeof S!=="object")S={name:"",grade:"",records:{},wrong:{}};
if(!S.records)S.records={}; if(!S.wrong)S.wrong={};
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function el(){return document.getElementById("app")}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function tn(){var d=new Date();return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function today(){return tn()}
function days(){return (WORDS[S.grade]||[])}
function dayData(n){var a=days();return a[(n-1)%a.length]}
function doneCount(){return Object.keys(S.records).length}
function curDay(){return Math.min(doneCount()+1,days().length)}
function streak(){
  var ds=Object.keys(S.records).map(function(k){return S.records[k].date}).sort();
  if(!ds.length)return 0;
  var last=new Date(ds[ds.length-1].replace(/-/g,"/"));
  var now=new Date();now.setHours(0,0,0,0);last.setHours(0,0,0,0);
  var diff=Math.round((now-last)/86400000);
  if(diff>1)return 0;
  var n=1;
  for(var i=ds.length-1;i>0;i--){
    var d1=new Date(ds[i].replace(/-/g,"/")),d0=new Date(ds[i-1].replace(/-/g,"/"));
    if(Math.round((d1-d0)/86400000)===1)n++;else break;
  }
  return n;
}
function allWords(){ // flat unique words learned
  var m={};var r=S.records;
  for(var k in r){ (r[k].words||[]).forEach(function(x){m[x[0]]=1}) }
  return Object.keys(m).length;
}
function accuracy(){
  var c=0,t=0;for(var k in S.records){c+=S.records[k].correct||0;t+=S.records[k].total||0}
  return t?Math.round(c/t*100):0;
}
function say(text,rate){
  try{
    if(!window.speechSynthesis)return;
    speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(text);
    u.lang="en-US";u.rate=rate||0.8;
    speechSynthesis.speak(u);
  }catch(e){}
}
function ic(p){ // tab icons
  var s='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">';
  return s+p+'</svg>';
}
var ICON_HOME='<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/>';
var ICON_EDIT='<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>';
var ICON_BAR='<path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/>';
var ICON_CAL='<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 11h18"/>';
function tabs(active){
  function t(k,name,icon){return '<div class="tab '+(active===k?'on':'')+'" onclick="go(\''+k+'\')">'+ic(icon)+name+'</div>'}
  return '<div class="tabs">'+t("home","首页",ICON_HOME)+t("practice","练习",ICON_EDIT)+t("report","报告",ICON_BAR)+t("records","记录",ICON_CAL)+'</div>';
}

/* ---------- 页面 ---------- */
function vSetup(){
  var gs=Object.keys(WORDS);
  var chips=gs.map(function(g){return '<div class="chip '+(S.grade===g?"on":"")+'" onclick="pickGrade(\''+g+'\')">'+g+'</div>'}).join("");
  el().innerHTML=
   '<div class="wrap" style="padding-top:26px">'+
   '<div class="logo">abc</div>'+
   '<div class="big-title">英语高频词 · 每日打卡</div>'+
   '<div class="sub">每天5分钟，孩子自己就能完成</div>'+
   '<div class="card" style="margin-top:18px"><b>家长您好 👋</b><div class="muted" style="margin-top:6px">打开就能用，不用下载、不用注册。第一次填好名字和年级，以后打开直接练。</div></div>'+
   '<div class="card"><div style="font-size:14px;font-weight:600;margin-bottom:8px">孩子的名字</div>'+
   '<input type="text" id="nm" maxlength="10" placeholder="比如：小明" value="'+esc(S.name)+'">'+
   '<div style="font-size:14px;font-weight:600;margin:14px 0 2px">选择年级</div>'+
   '<div class="chips">'+chips+'</div></div>'+
   '<button class="btn btn-green" onclick="startNow()">开始打卡</button>'+
   '<div class="muted center" style="margin-top:14px">1~6年级都有配套词库 · 数据存在本机</div>'+
   '</div>';
}
function vHome(){
  var daysArr=days(), n=curDay(), d=dayData(n), allDone=doneCount()>=daysArr.length;
  var cells="";
  for(var i=1;i<=daysArr.length;i++){
    var cls= i<n ? "done" : (i===n && !allDone ? "cur" : (S.records[i]?"done":""));
    if(S.records[i])cls="done"; if(i===n&&!allDone)cls="cur";
    cells+='<div class="cell '+cls+'">'+i+'</div>';
  }
  el().innerHTML=
   '<div class="hd">英语高频词打卡</div>'+
   '<div class="wrap">'+
   '<div class="card"><div class="urow"><div class="avatar">👦</div><div><div class="uname">'+esc(S.name)+'</div><div class="usub">'+esc(S.grade)+' · 已打卡 '+doneCount()+' 天</div></div><div class="pill">连续 '+streak()+' 天</div></div>'+
   '<div class="stats">'+
    '<div class="stat"><b>'+doneCount()+'</b><i>打卡次数</i></div>'+
    '<div class="stat"><b>'+streak()+'</b><i>连续天数</i></div>'+
    '<div class="stat"><b>'+allWords()+'</b><i>已学单词</i></div>'+
    '<div class="stat"><b>'+accuracy()+'%</b><i>总正确率</i></div>'+
   '</div></div>'+
   '<div class="card task"><div class="ic">🗓️</div><h3>'+(allDone?"15 天全部完成 🎉":"今天的任务：Day "+n)+'</h3>'+
   '<p>'+(allDone?"去练习页复习错词，保持记忆":esc(d.t)+'　共'+d.w.length+'个新词 · 约5分钟')+'</p>'+
   (allDone?'<button class="btn btn-green" onclick="go(\'practice\')">去复习错词</button>':'<button class="btn btn-orange" onclick="startLearn()">开始今日打卡</button>')+
   '</div>'+
   '<div class="card"><div style="font-size:15px;font-weight:700">闯关进度</div><div class="grid15">'+cells+'</div></div>'+
   '</div>'+tabs("home");
}

/* ---- 认一认 ---- */
var L=null;
function startLearn(){
  var n=curDay();
  L={day:n,i:0};
  vLearn();
}
function vLearn(){
  var n=L.day, d=dayData(n), it=d.w[L.i], total=d.w.length, last=(L.i===total-1);
  el().innerHTML=
   '<div class="hd"><span class="back" onclick="go(\'home\')">‹</span>认一认</div>'+
   '<div class="wrap"><div class="card">'+
   '<div class="tagline"><span class="tag">Day '+n+' · '+esc(d.t)+'</span><span class="muted">'+(L.i+1)+'/'+total+'</span></div>'+
   '<div class="word">'+esc(it[0])+'</div><div class="cmean">'+esc(it[1])+'</div>'+
   '<div class="pills"><button class="pillbtn pb-green" onclick="say(\''+esc(it[0])+'\')">🔊 读单词</button>'+
   '<button class="pillbtn pb-orange" onclick="followRead(\''+esc(it[0])+'\')">✏️ 跟我读</button></div>'+
   (it[2]?'<div class="exbox"><div class="en">'+esc(it[2])+'<span class="say" onclick="say(\''+esc(it[2])+'\',0.85)">🔊 听句子</span></div><div class="cn">'+esc(it[1])+'</div></div>':'')+
   '<div id="rd" class="muted center" style="margin-top:10px"></div>'+
   '<button class="btn btn-green" style="margin-top:14px" onclick="nextWord()">'+(last?'开始闯关 ›':'下一个 ›')+'</button>'+
   '<button class="btn btn-white" style="margin-top:10px" onclick="go(\'home\')">先回去，待会再学</button>'+
   '</div></div>';
  say(it[0]);
}
function nextWord(){
  var d=dayData(L.day);
  if(L.i<d.w.length-1){L.i++;vLearn();}
  else{L=null;startQuiz(false);}
}
function followRead(word){
  var box=document.getElementById("rd");
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){box.textContent="当前浏览器不支持录音打分，跟着大声读一遍就好～";return}
  try{
    var r=new SR(); r.lang="en-US"; r.interimResults=false; r.maxAlternatives=1;
    box.textContent="正在听…请读：" + word;
    r.onresult=function(e){
      var t=(e.results[0][0].transcript||"").trim().toLowerCase();
      var w=word.toLowerCase();
      var s=0;
      if(t===w)s=100;
      else if(t.indexOf(w)>=0||w.indexOf(t.replace(/[^a-z ]/g,""))>=0)s=90;
      else s=Math.max(50,Math.round(100-lev(w,t)*18));
      box.innerHTML='<span style="color:#1BA35C;font-weight:700">得分 '+s+' 分</span>（听到：'+esc(t)+'）'+(s>=90?" 太棒了！":" 再读一遍更准哦");
      if(s>=90)say(w);
    };
    r.onerror=function(){box.textContent="没听清，再点一次试试～"};
    r.start();
  }catch(e){box.textContent="录音启动失败，跟着读一遍即可"}
}
function lev(a,b){
  var m=[],i,j;
  for(i=0;i<=b.length;i++)m[i]=[i];
  for(j=1;j<=a.length;j++)m[0][j]=j;
  for(i=1;i<=b.length;i++)for(j=1;j<=a.length;j++){
    m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[j-1]===b[i-1]?0:1));
  }
  return m[b.length][a.length];
}

/* ---- 闯关 ---- */
var Q=null;
function gradePool(){var p=[];days().forEach(function(d){d.w.forEach(function(x){p.push(x)})});return p}
function makeQ(d){
  var pool=gradePool(), qs=[];
  d.w.forEach(function(it){
    qs.push({type:"spell",en:it[0],cn:it[1]});
    var t=Math.random()<0.5?"cn2en":"en2cn";
    qs.push({type:t,en:it[0],cn:it[1]});
  });
  shuffle(qs);
  qs.forEach(function(q){
    if(q.type==="spell")return;
    var opt=[],self=q.type==="cn2en"?q.en:q.cn;
    opt.push(self);
    while(opt.length<4){
      var p=pool[Math.floor(Math.random()*pool.length)];
      var v=(q.type==="cn2en")?p[0]:p[1];
      if(opt.indexOf(v)<0)opt.push(v);
    }
    q.opts=shuffle(opt.slice());
  });
  return qs;
}
function startQuiz(isReview){
  var d=dayData(curDay());
  Q={day:curDay(),qs:isReview?buildReview():makeQ(d),i:0,correct:0,right:[]};
  vQuiz();
}
function buildReview(){
  var ws=Object.keys(S.wrong).slice(0,8);
  var qs=[];
  ws.forEach(function(w){
    var info=findWord(w); if(!info)return;
    qs.push({type:"spell",en:info[0],cn:info[1]});
    qs.push({type:Math.random()<0.5?"cn2en":"en2cn",en:info[0],cn:info[1]});
  });
  if(!qs.length)return [];
  var pool=gradePool();
  qs.forEach(function(q){
    if(q.type==="spell")return;
    var opt=[q.type==="cn2en"?q.en:q.cn];
    while(opt.length<4){
      var p=pool[Math.floor(Math.random()*pool.length)];
      var v=q.type==="cn2en"?p[0]:p[1];
      if(opt.indexOf(v)<0)opt.push(v);
    }
    q.opts=shuffle(opt.slice());
  });
  return shuffle(qs).slice(0,8);
}
function findWord(w){
  var found=null;
  Object.keys(WORDS).forEach(function(g){WORDS[g].forEach(function(d){d.w.forEach(function(x){if(x[0]===w)found=x})})});
  return found;
}
function vQuiz(){
  var q=Q.qs[Q.i];
  if(!q){finishQuiz();return}
  var head='<div class="hd"><span class="back" onclick="go(\'home\')">‹</span>闯关</div>';
  var card='<div class="card"><div class="tagline"><span class="tag">Day '+Q.day+' 闯关</span><span class="muted">'+(Q.i+1)+'/'+Q.qs.length+'</span></div>';
  if(q.type==="spell"){
    card+='<div class="q">“'+esc(q.cn)+'” 用英文怎么拼写？</div>'+
      '<div class="center"><button class="pillbtn pb-green" onclick="say(\''+esc(q.en)+'\')">🔊 再听一遍</button></div>'+
      '<input type="text" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="在这里写出英文单词" style="margin-top:14px">'+
      '<button class="btn btn-green" style="margin-top:12px" onclick="submitSpell()">提交</button>'+
      '<div class="tip">💡 想不起来？点「再听一遍」，或者点下面的"看提示"。</div>'+
      '<button class="btn btn-white" style="margin-top:10px" onclick="hint()">看提示（首字母 '+esc(q.en[0])+'）</button>'+
      '<div id="fb" class="fb"></div>';
  }else{
    var qtext=q.type==="cn2en"?'“'+esc(q.cn)+'” 用英文怎么说？':'“'+esc(q.en)+'” 是什么意思？';
    card+='<div class="q">'+qtext+'</div>';
    q.opts.forEach(function(o,i){
      card+='<div class="opt" id="o'+i+'" onclick="pick('+i+')">'+esc(o)+'</div>';
    });
    card+='<div id="fb" class="fb"></div>';
    say(q.en);
  }
  card+='</div>';
  el().innerHTML=head+'<div class="wrap">'+card+'</div>';
  var inp=document.getElementById("ans"); if(inp)setTimeout(function(){inp.focus()},120);
}
function hint(){
  var q=Q.qs[Q.i], inp=document.getElementById("ans");
  if(inp&&!inp.value)inp.value=q.en[0];
  var fb=document.getElementById("fb");
  fb.className="fb";fb.innerHTML='<span style="color:#B4761A">提示：首字母 '+esc(q.en[0])+'，共 '+q.en.replace(/[^a-zA-Z]/g,"").length+' 个字母</span>';
}
function submitSpell(){
  var q=Q.qs[Q.i], inp=document.getElementById("ans");
  var v=(inp.value||"").trim().toLowerCase(), ok=(v===q.en.toLowerCase());
  var fb=document.getElementById("fb");
  if(ok){Q.correct++;Q.right.push([q.en,true]);fb.className="fb ok";fb.textContent="✅ 正确！正确答案：" + q.en}
  else{Q.right.push([q.en,false]);fb.className="fb no";fb.textContent="❌ 正确答案是：" + q.en + "，跟读一遍记住它";say(q.en)}
  setTimeout(nextQ,ok?850:1600);
}
var picked=false;
function pick(i){
  if(picked)return; picked=true;
  var q=Q.qs[Q.i], fb=document.getElementById("fb");
  var ans=q.type==="cn2en"?q.en:q.cn;
  var chosen=q.opts[i], ok=(chosen===ans);
  if(ok){document.getElementById("o"+i).className="opt right";Q.correct++;Q.right.push([q.en,true]);fb.className="fb ok";fb.textContent="✅ 回答正确！"+q.en+" — "+q.cn}
  else{
    document.getElementById("o"+i).className="opt wrong";
    q.opts.forEach(function(o,j){if(o===ans)document.getElementById("o"+j).className="opt right"});
    Q.right.push([q.en,false]);fb.className="fb no";fb.textContent="❌ 正确答案："+q.en+" — "+q.cn;say(q.en);
  }
  setTimeout(nextQ,ok?850:1700);
}
function nextQ(){picked=false;Q.i++;vQuiz()}
function finishQuiz(){
  var total=Q.qs.length, correct=Q.correct, day=Q.day;
  S.records[day]={date:today(),correct:correct,total:total,words:Q.right};
  Q.right.forEach(function(x){ if(x[1]){delete S.wrong[x[0]]} else {S.wrong[x[0]]=(S.wrong[x[0]]||0)+1} });
  save();
  var pct=Math.round(correct/total*100);
  var emo=pct>=100?"😄":(pct>=75?"🙂":"💪");
  var badge=pct>=100?"🏅 全部答对，一个错误都没有，太厉害了！":"✏️ 错了"+(total-correct)+"个，错题已收进错题本，明天再练一遍～";
  el().innerHTML='<div class="hd">闯关结果</div><div class="wrap"><div class="card res">'+
    '<div class="emo">'+emo+'</div><h2>Day '+day+' 打卡完成！</h2>'+
    '<div class="score">'+correct+' / '+total+'</div>'+
    '<div class="muted">正确率 '+pct+'%'+(pct>=75?"，太棒了！继续保持～":"，再接再厉！")+'</div>'+
    '<div class="badge">'+badge+'</div>'+
    '<button class="btn btn-green" style="margin-top:18px" onclick="go(\'report\')">📊 生成打卡报告图片</button>'+
    '<button class="btn btn-white" style="margin-top:10px" onclick="go(\'home\')">返回首页</button>'+
    '</div></div>';
}

/* ---- 报告 ---- */
function latestDay(){var ks=Object.keys(S.records);if(!ks.length)return 0;return Math.max.apply(null,ks.map(Number))}
function vReport(){
  var n=latestDay(), rec=S.records[n];
  var head='<div class="hd"><span class="back" onclick="go(\'home\')">‹</span>打卡报告</div>';
  if(!rec){
    el().innerHTML=head+'<div class="wrap"><div class="card center"><div style="font-size:40px">📝</div><div style="margin-top:10px;font-weight:700">还没有打卡记录</div><div class="muted" style="margin-top:6px">完成今天的打卡后，这里会生成报告卡片</div><button class="btn btn-green" style="margin-top:16px" onclick="go(\'home\')">去打卡</button></div></div>'+tabs("report");
    return;
  }
  var d=dayData(n), pct=Math.round(rec.correct/rec.total*100);
  var rows=rec.words.map(function(x){
    var info=findWord(x[0]);
    return '<div class="rrow"><span>'+esc(x[0])+'</span><span>'+esc(info?info[1]:"")+' <span class="'+(x[1]?"ok":"no")+'">'+(x[1]?"✓":"✗")+'</span></span></div>';
  }).join("");
  el().innerHTML=head+'<div class="wrap">'+
    '<div class="card" style="padding:0;overflow:hidden">'+
     '<div class="rcard" style="border-radius:16px 16px 0 0"><h3>英语高频词 · 每日打卡报告</h3><p>'+rec.date+' · '+esc(S.grade)+'</p></div>'+
     '<div style="padding:16px">'+
      '<div style="display:flex;justify-content:space-between"><b>'+esc(S.name)+'</b><span class="muted">正确率 '+pct+'%</span></div>'+
      '<div class="muted" style="margin-top:4px">今日进度：Day '+n+' · '+esc(d.t)+'</div>'+
      '<div style="margin-top:10px">'+rows+'</div>'+
      '<div class="rstats">'+
       '<div class="rstat"><b>'+doneCount()+'天</b><i>累计打卡</i></div>'+
       '<div class="rstat"><b>'+streak()+'天</b><i>连续打卡</i></div>'+
       '<div class="rstat"><b>'+accuracy()+'%</b><i>总正确率</i></div>'+
       '<div class="rstat"><b>'+Object.keys(S.wrong).length+'个</b><i>错词</i></div>'+
      '</div>'+
      '<div class="muted center" style="margin-top:12px">每天 5 分钟 · 小小进步看得见</div>'+
     '</div></div>'+
    '<div class="two"><button class="btn btn-orange" onclick="copyReport()">📋 复制图片</button>'+
    '<button class="btn btn-green" onclick="saveReport()">⬇ 保存图片</button></div>'+
    '<div class="muted center" style="margin-top:10px">复制后直接在微信里粘贴发给老师，或保存到相册再发</div>'+
   '</div>'+tabs("report");
}
function drawReport(){
  var n=latestDay(), rec=S.records[n]; if(!rec)return null;
  var d=dayData(n), pct=Math.round(rec.correct/rec.total*100);
  var W=750,H=1050,c=document.createElement("canvas");c.width=W;c.height=H;
  var x=c.getContext("2d");
  x.fillStyle="#F3F4F6";x.fillRect(0,0,W,H);
  x.fillStyle="#ffffff";r(x,30,30,W-60,H-60,24);x.fill();
  x.fillStyle="#1BA35C";r(x,30,30,W-60,170,24);x.fill();
  x.fillStyle="#fff";x.font="bold 30px 'Microsoft YaHei',sans-serif";
  x.fillText("英语高频词 · 每日打卡报告",70,100);
  x.font="20px 'Microsoft YaHei',sans-serif";x.globalAlpha=.92;
  x.fillText(rec.date+" · "+S.grade,70,145);x.globalAlpha=1;
  x.fillStyle="#1F2430";x.font="bold 26px 'Microsoft YaHei',sans-serif";
  x.fillText(S.name,70,250);
  x.fillStyle="#8A8F99";x.font="20px 'Microsoft YaHei',sans-serif";
  x.fillText("正确率 "+pct+"%",W-70-x.measureText("正确率 "+pct+"%").width,250);
  x.fillText("今日进度：Day "+n+" · "+d.t,70,290);
  var y=350;
  rec.words.forEach(function(w){
    var info=findWord(w[0]);
    x.fillStyle="#1F2430";x.font="bold 24px 'Microsoft YaHei',sans-serif";x.fillText(w[0],70,y);
    x.fillStyle="#8A8F99";x.font="20px 'Microsoft YaHei',sans-serif";
    var m=(info?info[1]:"")+"  "+(w[1]?"✓":"✗");
    x.fillText(m,W-70-x.measureText(m).width,y);
    x.strokeStyle="#EDEFF2";x.beginPath();x.moveTo(70,y+18);x.lineTo(W-70,y+18);x.stroke();
    y+=58;
  });
  y+=20;
  var stats=[[doneCount()+"天","累计打卡"],[streak()+"天","连续打卡"],[accuracy()+"%","总正确率"],[Object.keys(S.wrong).length+"个","错词"]];
  var bw=(W-140-3*14)/4;
  stats.forEach(function(s,i){
    var bx=70+i*(bw+14);
    x.fillStyle="#E8F7EE";r(x,bx,y,bw,110,16);x.fill();
    x.fillStyle="#1BA35C";x.font="bold 26px 'Microsoft YaHei',sans-serif";x.textAlign="center";
    x.fillText(s[0],bx+bw/2,y+52);
    x.fillStyle="#5FA57F";x.font="16px 'Microsoft YaHei',sans-serif";
    x.fillText(s[1],bx+bw/2,y+86);x.textAlign="left";
  });
  x.fillStyle="#B9BDC4";x.font="18px 'Microsoft YaHei',sans-serif";x.textAlign="center";
  x.fillText("每天 5 分钟 · 小小进步看得见",W/2,H-90);x.textAlign="left";
  return c;
}
function r(x,a,b,w,h,rad){x.beginPath();x.moveTo(a+rad,b);x.lineTo(a+w-rad,b);x.quadraticCurveTo(a+w,b,a+w,b+rad);x.lineTo(a+w,b+h-rad);x.quadraticCurveTo(a+w,b+h,a+w-rad,b+h);x.lineTo(a+rad,b+h);x.quadraticCurveTo(a,b+h,a,b+h-rad);x.lineTo(a,b+rad);x.quadraticCurveTo(a,b,a+rad,b);x.closePath()}
function saveReport(){
  var c=drawReport();if(!c)return;
  var a=document.createElement("a");a.download="打卡报告-"+S.name+"-"+today()+".png";a.href=c.toDataURL("image/png");a.click();
}
function copyReport(){
  var c=drawReport();if(!c)return;
  if(!navigator.clipboard||!window.ClipboardItem){alert("当前浏览器不支持复制图片，请用「保存图片」");return}
  c.toBlob(function(b){
    try{navigator.clipboard.write([new ClipboardItem({"image/png":b})]).then(function(){alert("已复制！去微信里粘贴发给老师吧")},function(){alert("复制失败，请用「保存图片」")})}
    catch(e){alert("复制失败，请用「保存图片」")}
  });
}

/* ---- 练习 ---- */
function vPractice(){
  var ws=Object.keys(S.wrong);
  var list=ws.length?ws.map(function(w){var i=findWord(w);return '<div class="rowline"><span>'+esc(w)+' <small>'+esc(i?i[1]:"")+'</small></span><small>错 '+S.wrong[w]+' 次</small></div>'}).join(""):'<div class="center muted" style="padding:24px 0">暂无错词，太棒了！</div>';
  el().innerHTML='<div class="hd">练习</div><div class="wrap">'+
   '<div class="card"><div style="font-weight:700;margin-bottom:4px">错题本（'+ws.length+' 个）</div>'+list+'</div>'+
   (ws.length?'<button class="btn btn-green" onclick="startReviewQuiz()">开始复习错词</button>':'')+
   '</div>'+tabs("practice");
}
function startReviewQuiz(){
  var qs=buildReview();
  if(!qs.length){alert("没有可复习的错词");return}
  Q={day:latestDay()||1,qs:qs,i:0,correct:0,right:[],review:true};
  vQuiz();
}

/* ---- 记录 ---- */
function vRecords(){
  var now=new Date(),y=now.getFullYear(),mo=now.getMonth();
  var first=new Date(y,mo,1).getDay(), dim=new Date(y,mo+1,0).getDate();
  var has={};Object.keys(S.records).forEach(function(k){has[S.records[k].date]=1});
  var cells="";["日","一","二","三","四","五","六"].forEach(function(d){cells+='<div class="hd7">'+d+'</div>'});
  for(var i=0;i<first;i++)cells+='<div></div>';
  for(var d=1;d<=dim;d++){
    var ds=y+"-"+("0"+(mo+1)).slice(-2)+"-"+("0"+d).slice(-2);
    var cls="d"+(has[ds]?" has":"")+(ds===today()?" today":"");
    cells+='<div class="'+cls+'">'+d+'</div>';
  }
  var rows=Object.keys(S.records).sort(function(a,b){return b-a}).map(function(k){
    var r=S.records[k],pct=Math.round(r.correct/r.total*100);
    return '<div class="rowline"><span>Day '+k+' <small>'+r.date+'</small></span><small>'+r.correct+'/'+r.total+' · '+pct+'%</small></div>';
  }).join("")||'<div class="center muted" style="padding:20px 0">还没有记录</div>';
  el().innerHTML='<div class="hd">记录</div><div class="wrap">'+
   '<div class="card"><div style="font-weight:700;margin-bottom:10px">'+(mo+1)+'月打卡日历</div><div class="cal">'+cells+'</div></div>'+
   '<div class="card"><div style="font-weight:700;margin-bottom:4px">打卡历史</div>'+rows+'</div>'+
   '</div>'+tabs("records");
}

/* ---- 路由 ---- */
var route="home";
function render(){
  if(!S.name||!S.grade){vSetup();return}
  if(route==="setup")vSetup();
  else if(route==="learn")vLearn();
  else if(route==="quiz")vQuiz();
  else if(route==="report")vReport();
  else if(route==="practice")vPractice();
  else if(route==="records")vRecords();
  else vHome();
}
window.go=function(p){route=p;render();window.scrollTo(0,0)};
window.pickGrade=function(g){
  S.grade=g;save();
  var chips=document.querySelectorAll(".chip");
  Object.keys(WORDS).forEach(function(k,i){chips[i].className="chip "+(k===g?"on":"")});
};
window.startNow=function(){
  var n=document.getElementById("nm").value.trim();
  if(!n){alert("请先填写孩子的名字");return}
  if(!S.grade){alert("请选择年级");return}
  S.name=n;save();go("home");
};
window.startLearn=startLearn;
window.startQuiz=startQuiz;
window.startReviewQuiz=startReviewQuiz;
window.nextWord=nextWord;
window.submitSpell=submitSpell;
window.hint=hint;
window.pick=pick;
window.followRead=followRead;
window.say=say;
window.saveReport=saveReport;
window.copyReport=copyReport;
if(S.name&&S.grade){route="home";vHome()}else{vSetup()}
})();
</script>
